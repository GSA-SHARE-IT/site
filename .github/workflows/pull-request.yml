name: pull request

on: [pull_request]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - env:
          ELEVENTY_ENV: production
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
          retention-days: 1

  pa11y-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: npm
      - name: Install node dependencies
        run: npm ci
      - name: Refresh assets
        run: npm run assets:refresh
      - name: Accessibility scan
        run: npm run test:pa11y-ci

  validate_html:
    needs: [build]
    name: validate html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site/
      - run: npm run test:html-validation


  check_links:
    needs: [build]
    name: Check all links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site/
      - name: Test all links
        run: npm run test:links

  unit_tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Install node dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test

  e2e_tests:
    name: Playwright tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Install node dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lint:
    name: Run linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Install node dependencies
        run: npm ci
      - name: Run eslint
        run: npm run lint
