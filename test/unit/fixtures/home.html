<!-- Trimmed copy of the homepage markup that home.js hooks into (see index.html) -->
<header class="site-header"></header>

<section class="hero">
  <button type="button" class="rotate-toggle" id="rotate-toggle" data-paused="false" hidden>
    <span class="usa-sr-only" data-label>Pause rotating agency names</span>
  </button>
  <h1 id="hero-title">
    Code built for
    <span class="glyph glyph-agency" id="glyph-agency" aria-hidden="true">GSA</span>
    should serve all of government.
  </h1>
</section>

<div class="tabs" data-tabs hidden>
  <button type="button" class="tab" data-tab-for="panel-teams">Project teams</button>
  <button type="button" class="tab" data-tab-for="panel-agencies">Agencies</button>
  <button type="button" class="tab" data-tab-for="panel-congress">Report to Congress</button>
</div>

<div class="panels">
  <div class="panel" id="panel-teams" data-checklist>
    <div class="progress" hidden>
      <span data-count>0 of 3</span>
      <div class="bar" role="progressbar" aria-valuenow="0"><span></span></div>
      <p data-done hidden>All done!</p>
    </div>
    <input type="checkbox" id="check-a" checked>
    <input type="checkbox" id="check-b">
    <input type="checkbox" id="check-c">
  </div>

  <div class="panel" id="panel-agencies" data-checklist>
    <h3 id="for-agencies">For agencies</h3>
    <div class="progress" hidden>
      <span data-count>0 of 2</span>
      <div class="bar" role="progressbar" aria-valuenow="0"><span></span></div>
    </div>
    <input type="checkbox" id="check-d">
    <ul class="checks--choice">
      <li><input type="checkbox" id="check-e"></li>
      <li><input type="checkbox" id="check-f"></li>
    </ul>
  </div>

  <div class="panel" id="panel-congress">
    <h3 id="for-congress">For report to Congress</h3>
  </div>
</div>
